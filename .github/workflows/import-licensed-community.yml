name: Import Licensed Community Providers

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  import:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout target
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Fetch licensed upstream collections
        run: |
          set -e
          git clone --depth 1 https://github.com/yoruix/nuvio-providers.git /tmp/yoruix
          git clone --depth 1 https://github.com/phisher98/phisher-nuvio-providers.git /tmp/phisher
          git clone --depth 1 https://github.com/Gowaru/gowaru-nuvio-providers.git /tmp/gowaru
          git clone --depth 1 https://github.com/NuvioPlugin/All-in-One-Nuvio.git /tmp/d3adly

      - name: Import unique providers
        run: |
          python3 - <<'PY'
          import json, os, shutil, re
          from pathlib import Path

          ROOT = Path('.')
          PROVIDERS = ROOT / 'providers'
          PROVIDERS.mkdir(exist_ok=True)
          manifest_path = ROOT / 'manifest.json'

          with manifest_path.open(encoding='utf-8') as f:
              target = json.load(f)

          existing = {}
          for s in target.get('scrapers', []):
              sid = str(s.get('id','')).strip().lower()
              if sid:
                  existing[sid] = s

          sources = [
              ('yoruix', Path('/tmp/yoruix'), 'GPL-3.0'),
              ('phisher', Path('/tmp/phisher'), 'GPL-3.0'),
              ('gowaru', Path('/tmp/gowaru'), 'GPL-3.0'),
              ('d3adly', Path('/tmp/d3adly'), 'GPL-3.0'),
          ]

          imported = []
          for label, repo, license_name in sources:
              man = repo / 'manifest.json'
              if not man.exists():
                  print(label, ': no manifest')
                  continue
              with man.open(encoding='utf-8') as f:
                  data = json.load(f)

              lic = repo / 'LICENSE'
              if lic.exists():
                  shutil.copyfile(lic, ROOT / f'LICENSE-{label}.txt')

              for entry in data.get('scrapers', []):
                  sid_raw = str(entry.get('id','')).strip()
                  sid = sid_raw.lower()
                  rel = str(entry.get('filename','')).strip()
                  if not sid or not rel or sid in existing:
                      continue
                  src = repo / rel
                  if not src.is_file() or src.suffix.lower() != '.js':
                      continue

                  safe_sid = re.sub(r'[^a-zA-Z0-9._-]+', '-', sid_raw).strip('-') or 'provider'
                  dest_dir = PROVIDERS / label
                  dest_dir.mkdir(parents=True, exist_ok=True)
                  dest = dest_dir / (safe_sid + '.js')
                  shutil.copyfile(src, dest)

                  new_entry = dict(entry)
                  new_entry['id'] = sid_raw
                  new_entry['filename'] = str(dest).replace(os.sep, '/')
                  new_entry['author'] = entry.get('author') or label
                  new_entry['license'] = license_name
                  existing[sid] = new_entry
                  imported.append((label, sid_raw, str(dest)))

          target['name'] = 'NV Plugins'
          target['version'] = '4.0.0'
          target['description'] = 'Consolidated Nuvio providers from maintained, GPL-licensed community repositories with duplicate IDs removed.'
          target['author'] = 'xrexzerox'
          target['scrapers'] = list(existing.values())

          with manifest_path.open('w', encoding='utf-8') as f:
              json.dump(target, f, indent=2, ensure_ascii=False)
              f.write('\n')

          print('Imported new providers:', len(imported))
          for item in imported:
              print('  +', item)
          print('Total unique providers:', len(target['scrapers']))
          PY

      - name: Publish consolidated collection
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add manifest.json providers LICENSE-*.txt
          git commit -m 'Add licensed community Nuvio providers' || true
          git pull --rebase origin main
          git push origin HEAD:main
